name: Create Release

on:
  push:
    tags:
      - 'v*' # Triggers when a tag like v1.0.0 is pushed
  workflow_dispatch:

permissions:
  contents: write # Needed to create the release

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --dart-define=API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Build Web
        run: flutter build web --release --dart-define=API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Archive Web Build
        run: tar -czf chatbud-web-build.tar.gz -C build/web .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            chatbud-web-build.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
