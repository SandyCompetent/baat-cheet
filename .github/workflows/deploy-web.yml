name: Deploy Flutter Web and Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "deploy-web-apk"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_CHATBUD_OFFICIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHATBUD_OFFICIAL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --dart-define=API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Build Android APK
        run: flutter build apk --debug --dart-define=API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: build/app/outputs/flutter-apk/app-debug.apk
          name: Latest Build
          body: "Automatic build from the latest commit."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.FIREBASE_SERVICE_ACCOUNT_CHATBUD_OFFICIAL != ''
        continue-on-error: true
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHATBUD_OFFICIAL }}'
          channelId: live
          projectId: chatbud-official
