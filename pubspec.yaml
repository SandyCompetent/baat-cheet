name: chatbud
description: A new Flutter chat application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^2.0.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  shared_preferences: ^2.5.6
  cloud_firestore: ^7.0.0
  flutter_secure_storage: ^11.2.0
  firebase_ai: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_logo.png


