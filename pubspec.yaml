name: chatbud
description: Developer portfolio showcase — Stateful Multi-Agent AI Workspace & Grounded RAG Platform (Non-commercial).

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^2.0.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  shared_preferences: ^2.5.6
  cloud_firestore: ^7.0.0
  flutter_secure_storage: ^11.2.0
  firebase_ai: ^5.0.0
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.12
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^8.2.0
  speech_to_text: ^7.2.0
  get_it: ^9.3.0
  firebase_crashlytics: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0B101A"
    theme_color: "#0B101A"
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0B101A"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
